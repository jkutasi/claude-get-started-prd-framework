# TEMPLATE: Copy this file into your project's .github/workflows/ and fill in TODO items
name: Claude Mention Handler

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  respond:
    # Only run when the comment body contains "@claude"
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # TODO: Adjust the system prompt to reflect your project's context and conventions.
          direct_prompt: |
            You are a helpful assistant for this repository.
            A user mentioned you in a comment. Read the comment and respond helpfully.
            Be concise. Do not repeat the question back. Do not use filler phrases.

            Comment author: ${{ github.event.comment.user.login }}
            Comment body: ${{ github.event.comment.body }}

            Context — issue or PR title: ${{ github.event.issue.title }}
