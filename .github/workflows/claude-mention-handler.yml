# OPTIONAL TEMPLATE: delete if GitHub issue/PR mentions should not invoke an AI model.
name: Claude Mention Handler

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  respond:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Respond to the repository mention below.
            Read WORKFLOW.md first. Do not edit files because this workflow has
            read-only repository permission. Be concise and state when implementation
            requires a separately authorized task.

            Author: ${{ github.event.comment.user.login }}
            Comment: ${{ github.event.comment.body }}
            Issue or PR: ${{ github.event.issue.title }}
          claude_args: |
            --model claude-fable-5
            --max-turns 10
